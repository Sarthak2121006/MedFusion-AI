<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login | MedFusion AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="icon" type="image/png" href="/assets/medfusion_icon.png">
  <link rel="shortcut icon" href="/assets/medfusion_icon.png">
  <style>
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 antialiased min-h-screen flex items-center justify-center p-6 relative overflow-hidden">
  
  <!-- Ambient Glows -->
  <div class="fixed inset-0 pointer-events-none overflow-hidden z-0">
    <div class="absolute -top-40 left-1/2 -translate-x-1/2 w-[42rem] h-[30rem] bg-teal-500/10 rounded-full blur-[140px]"></div>
    <div class="absolute -bottom-40 right-10 w-96 h-96 bg-emerald-500/5 rounded-full blur-[120px]"></div>
  </div>

  <main class="relative z-10 w-full max-w-md">
    
    <!-- Card Container -->
    <div class="rounded-3xl border border-slate-800 bg-[#0c1322]/95 p-8 sm:p-10 shadow-2xl backdrop-blur-xl space-y-6">
      
      <!-- Brand Header -->
      <div class="flex items-center justify-between">
        <a href="index.html" class="flex items-center gap-3 group">
          <div class="h-12 w-12 rounded-xl bg-slate-900 border border-teal-500/30 p-1.5 flex items-center justify-center shadow-lg shadow-teal-500/20 group-hover:scale-105 group-hover:border-teal-400 transition-all shrink-0">
            <img src="/assets/medfusion_icon.png" alt="MedFusion AI Logo" class="h-full w-full object-contain">
          </div>
          <div>
            <div class="font-extrabold text-lg text-white leading-none">MedFusion AI</div>
            <div class="text-[10px] font-bold text-teal-400 mt-1 uppercase tracking-widest">Health Intelligence</div>
          </div>
        </a>
        <div class="flex items-center gap-3">
          <div class="flex items-center gap-1 bg-slate-900 border border-slate-700/80 rounded-lg px-2 py-1 shadow-sm">
            <span class="text-teal-400 text-xs">🌐</span>
            <select data-lang-selector onchange="if(window.setLanguage) window.setLanguage(this.value);" class="bg-transparent text-slate-200 text-xs font-bold border-none outline-none cursor-pointer">
              <option value="en" class="bg-slate-950 text-white">English</option>
              <option value="hi" class="bg-slate-950 text-white">हिन्दी</option>
              <option value="mr" class="bg-slate-950 text-white">मराठी</option>
            </select>
          </div>
          <a href="index.html" class="text-xs text-slate-400 hover:text-white transition-colors" data-i18n="back_to_home">&larr; Back to Home</a>
        </div>
      </div>

      <!-- Welcome Title -->
      <div>
        <p class="text-xs font-bold uppercase tracking-widest text-teal-400">PATIENT ACCESS</p>
        <h1 class="text-2xl font-extrabold text-white mt-1">Sign In to Dashboard</h1>
        <p class="text-xs text-slate-400 mt-1.5 leading-relaxed">Access your multimodal health analysis reports and personal timeline.</p>
      </div>

      <!-- 1-Click Demo Account -->
      <div class="rounded-xl border border-teal-500/30 bg-teal-500/10 p-3.5 flex items-center justify-between">
        <div class="text-xs">
          <div class="font-bold text-teal-300">Quick Demo Account</div>
          <div class="text-slate-400 text-[11px]">test@medfusion.ai / Password123</div>
        </div>
        <button id="fill-demo-btn" type="button" class="px-3 py-1.5 rounded-lg bg-teal-500 hover:bg-teal-400 text-slate-950 font-bold text-xs transition-colors">
          Use Demo
        </button>
      </div>

      <!-- Error Toast Alert -->
      <div id="error-toast" class="hidden rounded-xl border border-rose-500/30 bg-rose-500/10 p-3 text-xs text-rose-300"></div>

      <!-- Login Form -->
      <form id="login-form" class="space-y-4">
        <div>
          <label for="email" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Email Address</label>
          <input id="email" name="email" type="email" autocomplete="email" required class="w-full rounded-xl border border-slate-700 bg-slate-900/90 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-400" placeholder="you@example.com">
        </div>

        <div class="relative">
          <label for="password" class="block text-xs font-bold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required class="w-full rounded-xl border border-slate-700 bg-slate-900/90 px-4 py-2.5 text-sm text-white placeholder-slate-500 focus:border-teal-400 focus:outline-none focus:ring-1 focus:ring-teal-400 pr-16" placeholder="Enter password">
          <button type="button" id="toggle-password" class="absolute right-3 top-8 text-xs font-semibold text-slate-400 hover:text-white">Show</button>
        </div>

        <button type="submit" id="login-submit" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-400 hover:to-emerald-300 text-slate-950 font-extrabold text-sm shadow-lg shadow-teal-500/20 transition-all transform hover:-translate-y-0.5">
          Login & Open Dashboard
        </button>
      </form>

      <!-- Register Link -->
      <div class="text-center text-xs text-slate-400 pt-3 border-t border-slate-800">
        New to MedFusion AI? <a href="register.html" class="font-bold text-teal-400 hover:underline">Create an account</a>
      </div>

    </div>
  </main>

  <script type="module">
    import { redirectIfAuthenticated, loginUser } from './js/auth.js';
    import './js/i18n.js';
    redirectIfAuthenticated();

    const form = document.querySelector('#login-form');
    const passwordInput = document.querySelector('#password');
    const toggle = document.querySelector('#toggle-password');
    const button = document.querySelector('#login-submit');
    const demoBtn = document.querySelector('#fill-demo-btn');
    const errorToast = document.querySelector('#error-toast');

    demoBtn?.addEventListener('click', () => {
      form.email.value = 'test@medfusion.ai';
      passwordInput.value = 'Password123';
    });

    toggle?.addEventListener('click', () => {
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      toggle.textContent = isPassword ? 'Hide' : 'Show';
    });

    form?.addEventListener('submit', async event => {
      event.preventDefault();
      const email = form.email.value.trim();
      const password = passwordInput.value;
      if (!email || !password) return;

      button.disabled = true;
      button.textContent = 'Signing in...';
      errorToast.classList.add('hidden');

      try {
        await loginUser(email, password);
        window.location.href = 'dashboard.html';
      } catch (error) {
        errorToast.textContent = error.message || 'Login failed. Please check your credentials.';
        errorToast.classList.remove('hidden');
      } finally {
        button.disabled = false;
        button.textContent = 'Login & Open Dashboard';
      }
    });
  </script>
</body>
</html>
