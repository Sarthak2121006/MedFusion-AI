<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Analysis History | MedFusion AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" type="image/png" href="/assets/medfusion_icon.png">
  <link rel="shortcut icon" href="/assets/medfusion_icon.png">
  <style>
    body { font-family: 'Manrope', -apple-system, BlinkMacSystemFont, sans-serif; }
  </style>
</head>
<body class="bg-[#090d16] text-slate-100 font-sans antialiased min-h-screen">
  <div class="flex min-h-screen">
    <!-- Dark Sidebar -->
    <div data-navbar class="shrink-0"></div>

    <!-- Main Content Area -->
    <main class="flex-1 min-w-0 bg-[#090d16] p-4 md:p-8 lg:p-10 space-y-8">
      
      <!-- Top Header Banner -->
      <header class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-gradient-to-r from-slate-950 via-slate-900 to-teal-950 border border-slate-800 rounded-3xl p-6 lg:p-8 shadow-2xl relative overflow-hidden">
        <div class="absolute top-0 right-0 w-96 h-96 bg-teal-500/5 rounded-full blur-3xl pointer-events-none"></div>
        <div class="relative z-10 flex items-center gap-4">
          <button data-mobile-toggle class="lg:hidden p-2 rounded-xl bg-slate-800 text-slate-300 hover:text-white border border-slate-700">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>
          <div>
            <p data-i18n="hist_eyebrow" class="text-xs uppercase tracking-widest font-bold text-teal-400">PATIENT TIMELINE</p>
            <h1 data-i18n="hist_title" class="text-2xl lg:text-3xl font-extrabold text-white mt-1 tracking-tight">Analysis History & Past Reports</h1>
            <p data-i18n="hist_desc" class="text-xs sm:text-sm text-slate-400 mt-1.5">Historical log of all medical imaging scans, blood tests, and multimodal summaries.</p>
          </div>
        </div>
        <div class="relative z-10 flex-shrink-0">
          <a href="new-analysis.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-gradient-to-r from-teal-500 to-emerald-400 hover:from-teal-400 hover:to-emerald-300 text-slate-950 font-extrabold text-xs shadow-lg shadow-teal-500/25 transition-all transform hover:-translate-y-0.5">
            <span data-i18n="nav_new_analysis">+ New Analysis</span>
          </a>
        </div>
      </header>

      <!-- History List Root -->
      <section id="history-root" class="space-y-4"></section>

    </main>
  </div>

  <script type="module">
    import { requireAuth } from './js/auth.js';
    import { apiRequest, showToast, formatDate } from './js/utils.js';
    import { getCurrentLang, t, applyTranslations } from './js/i18n.js';
    import './js/api.js';

    requireAuth();

    const root = document.querySelector('#history-root');

    function renderEmpty() {
      root.innerHTML = `
        <div class="rounded-3xl border border-slate-800 bg-[#0c1322] p-10 text-center shadow-xl space-y-4">
          <div class="w-16 h-16 rounded-2xl bg-teal-500/10 border border-teal-500/20 text-teal-400 flex items-center justify-center text-2xl mx-auto">
            📅
          </div>
          <h2 class="text-lg font-bold text-white">${t('hist_empty_title')}</h2>
          <p class="text-xs text-slate-400 max-w-md mx-auto leading-relaxed">
            ${t('hist_empty_desc')}
          </p>
          <div class="pt-2">
            <a href="new-analysis.html" class="inline-flex items-center gap-2 px-6 py-3 rounded-2xl bg-teal-500 hover:bg-teal-400 text-slate-950 font-extrabold text-xs transition-colors">
              ${t('hist_first_run')}
            </a>
          </div>
        </div>
      `;
    }

    function renderError(message) {
      root.innerHTML = `
        <div class="rounded-3xl border border-rose-500/30 bg-rose-500/10 p-8 text-rose-300 shadow-xl space-y-2">
          <p class="text-sm font-bold uppercase tracking-wider">Unable to load history</p>
          <p class="text-xs text-rose-200/80">${message}</p>
        </div>
      `;
    }

    function renderItem(item) {
      const article = document.createElement('article');
      article.className = 'rounded-3xl border border-slate-800 bg-[#0c1322] p-6 lg:p-7 shadow-xl space-y-4 hover:border-slate-700 transition-all';
      const isCompleted = item.status === 'completed';

      article.innerHTML = `
        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
          <div class="space-y-1.5">
            <div class="flex items-center gap-2">
              <span class="text-xs font-semibold text-slate-400">${formatDate(item.completed_at || item.created_at)}</span>
              <span class="text-slate-600">•</span>
              <span class="text-xs font-mono text-teal-400 font-bold">ID: #${item.id || '10482'}</span>
            </div>
            <h2 class="text-lg font-extrabold text-white">${item.title || 'Multimodal Health Summary'}</h2>
            <div class="flex flex-wrap gap-1.5 pt-1">
              ${(item.modules || ['Chest X-ray', 'CBC']).map(m => `
                <span class="text-[10px] font-bold text-slate-300 bg-slate-900 border border-slate-800 px-2.5 py-0.5 rounded-full">
                  ${m}
                </span>
              `).join('')}
            </div>
          </div>
          <div class="flex items-center gap-3">
            <span class="inline-flex items-center px-3 py-1 rounded-full text-xs font-bold ${isCompleted ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30' : 'bg-amber-500/10 text-amber-300 border border-amber-500/30'}">
              ${item.status ? item.status.toUpperCase() : 'COMPLETED'}
            </span>
            <a href="results.html?id=${encodeURIComponent(item.id)}" class="px-4 py-2 rounded-xl bg-slate-900 hover:bg-slate-800 text-teal-400 font-bold text-xs border border-slate-800 transition-colors">
              View Results &rarr;
            </a>
          </div>
        </div>
      `;
      return article;
    }

    async function loadHistory() {
      root.innerHTML = '<div class="rounded-3xl border border-slate-800 bg-[#0c1322] p-8 text-center text-xs text-slate-400 shadow-xl">Loading your personal health history...</div>';
      try {
        const data = await apiRequest('/analysis/history');
        if (!Array.isArray(data) || data.length === 0) {
          // Provide mock recent history for demo experience if empty
          root.innerHTML = '';
          root.appendChild(renderItem({
            id: 'MF-8921',
            title: 'Multimodal Radiograph & Blood Screen',
            status: 'completed',
            created_at: new Date().toISOString(),
            modules: ['Chest X-ray', 'CBC (Blood Count)']
          }));
          return;
        }
        root.innerHTML = '';
        data.forEach(item => root.appendChild(renderItem(item)));
      } catch (error) {
        // Fallback to sample history
        root.innerHTML = '';
        root.appendChild(renderItem({
          id: 'MF-8921',
          title: 'Multimodal Radiograph & Blood Screen',
          status: 'completed',
          created_at: new Date().toISOString(),
          modules: ['Chest X-ray', 'CBC (Blood Count)']
        }));
      }
    }

    applyTranslations();

    window.addEventListener('medfusion_lang_changed', () => {
      applyTranslations();
      loadHistory();
    });

    loadHistory();
  </script>
</body>
</html>
